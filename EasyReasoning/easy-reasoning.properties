# Read on application startup. Restart the application after editing.
spring.ai.ollama.base-url=http://localhost:11434
spring.ai.ollama.chat.model=qwen2.5:7b

# Optional vacancy boundary trimming, applied by EasyReasoning for every caller.
vacancy.trimming.enabled=false

# Batch description deduplication: off or qwen. Read at the start of each batch.
dedup.mode=qwen

# Explicit context shared by local budget checks and Ollama requests.
spring.ai.ollama.chat.options.num-ctx=4096

