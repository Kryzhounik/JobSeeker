[filters]
title = off
languages = on
# off = ignore, on = any remote, location = only configured remote scopes.
remote = location
# off = ignore, on = any relocation, location = only configured destinations.
relocation = location
# any = remote OR relocation can pass. all = both must pass.
remote_relocation_mode = any

[title]
blocked_terms =

[remote]
# Full remote uses remote_scope only. Office/listed job location is ignored here.
allowed_scopes = worldwide, Ukraine, Moldova, Georgia, Serbia

[relocation]
allowed_destinations = Poland, Lithuania, Latvia, Czechia, Estonia, Central Europe, Southern Europe
