# Shared human-language proficiency policy for the script and job-facts agent.
# Interpret wording semantically, including equivalent phrasing and word forms.
# The script uses the lower bound. A single value is a fixed range.
# The agent starts from the lower bound and chooses the upper bound only when
# the described language tasks require the complexity, precision, nuance, or
# independence of communication characteristic of that higher CEFR level.
# If the context does not establish that need, keep the lower bound.
# Never leave the allowed range. Preserve explicitly stated CEFR requirements;
# for an explicit range or alternative levels, use the lowest accepted level.
# required applies only when a language is mandatory without proficiency wording.

[ranges]
beginner = A1
elementary = A2
pre_intermediate = A2
intermediate = B1
upper_intermediate = B2
professional = B2
professional_working_proficiency = B2
full_professional_proficiency = C1
advanced = C1
native = C2
bilingual = C2
communication_skills = B1-B2
communicative = B1-B2
good = B1-B2
very_good = B2-C1
strong = B2-C1
proficient = B2-C1
excellent = B2-C1
fluent = B2-C1
near_native = C1-C2
required = B1

# Textual level names refer to the table above; CEFR A1-C2 names are built in.
[level_aliases]
Intermediate = intermediate
Upper-Intermediate = upper_intermediate
Upper Intermediate = upper_intermediate
zaawansowany = advanced
zaawansowanym = advanced
Native = native
Near-Native = near_native
