[proxy]
model = gpt-6-sol
reasoning_effort = high
ignore_user_config = true
ephemeral = false
sandbox = readOnly
add_dirs =

# Accounting rates preserve the existing credit scale:
# 1 credit-rate unit = 1 USD/Mtok * 31.25.
# Standard short-context OpenAI prices are documented in USD/Mtok.
[model:gpt-6-astra]
# Explicit opt-in only; not used by the default runtime because of its cost.
# $10 input / $1 cached input / $50 output
input_credit_rate = 312.5
cached_input_credit_rate = 31.25
output_credit_rate = 1562.5

[model:gpt-6-sol]
# $2 input / $0.20 cached input / $10 output
input_credit_rate = 62.5
cached_input_credit_rate = 6.25
output_credit_rate = 312.5

[model:gpt-6-luna]
# $0.10 input / $0.01 cached input / $0.50 output
input_credit_rate = 3.125
cached_input_credit_rate = 0.3125
output_credit_rate = 15.625

# Legacy fallback options. These remain available for comparison and rollback;
# they are not selected by the default runtime.
[model:gpt-5.6-sol]
input_credit_rate = 125
cached_input_credit_rate = 12.5
output_credit_rate = 750

[model:gpt-5.6-terra]
input_credit_rate = 62.5
cached_input_credit_rate = 6.25
output_credit_rate = 375

[model:gpt-5.6-luna]
input_credit_rate = 25
cached_input_credit_rate = 2.5
output_credit_rate = 150

[model:gpt-5.5]
input_credit_rate = 125
cached_input_credit_rate = 12.5
output_credit_rate = 750
