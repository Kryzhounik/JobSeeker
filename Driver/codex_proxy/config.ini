[proxy]
model = gpt-5.6-sol
reasoning_effort = medium
ignore_user_config = true
ephemeral = true
sandbox = readOnly
add_dirs =

[operation:job_facts]
instruction = analyzer/job_facts/extract.md
output_schema = contracts/job_analysis.schema.json
contexts =
merge_input = false

[operation:candidate_fit]
instruction = analyzer/candidate_fit/evaluate.md
output_schema = contracts/candidate_fit_result.schema.json
contexts = analyzer/config/resume.ini
merge_input = true

[model:gpt-5.6-sol]
input_credit_rate = 125
cached_input_credit_rate = 12.5
output_credit_rate = 750

