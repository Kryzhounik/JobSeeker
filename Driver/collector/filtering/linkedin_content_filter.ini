# Conservative requirement templates applied to each non-empty line and
# adjacent line pair. Every hard template must bind the blocked technology
# through {technology}; {years} means a range starting at two years,
# written as digits or English words from two through ten.

[filters]
enabled = on

[pass_words]
values = Java

[blocked_technologies]
values =
    Camunda
    C
    Python
    Go
    Golang
    JavaScript
    JS
    ElectronJS
    Electron.js
    HTML
    CSS
    C++
    React
    TypeScript
    Node.js
    NodeJS
    PHP
    C#
    FastAPI
    .NET
    Rust
    Ruby
    PySpark
    Spark
    Drupal
    Laravel
    Linux kernel
    Haskell
    Unity
    ABAP
    SAP ABAP

[hard_requirement_templates]
values =
    \bproficiency\s+in\s+(?:(?:developing|building|creating|designing|implementing)\b[^.;:\r\n]{0,120}\b(?:using|with)\s+)?{technology}
    \bproficient\s+in\s+{technology}
    \bfluent\s+(?:in\s+)?(?:contest\s+)?{technology}
    \bexpertise\s+in\s+{technology}
    \bproven\s+knowledge\s+(?:of|in)\s+{technology}
    \bproven\s+experience\s+in\s+{technology}\s+development\b
    \bsolid\s+{technology}\s+proficiency\b
    \bstrong\s+{technology}\s*;
    \bstrong\s+[^.;:\r\n]{0,120}{technology}[^.;:\r\n]{0,120}\bskills?\b
    \bstrong\s+(?:[\w-]+\s+){0,4}(?:development|programming)\s+experience\s+(?:with|in|using)\s+{technology}
    \bstrong\s+hands[-\s]on\s+experience\s+(?:with|in|using)\s+{technology}
    \b(?:deep\s+)?hands[-\s]on\s+expertise\s+(?:with|in|using)\s+{technology}
    \bskills?\s+in\s+{technology}
    \bexperience\s+(?:developing|working|programming|coding)(?:\s+[\w-]+){0,4}\s+(?:with|in|using)?\s*{technology}
    {technology}\s+(?:programming\s+|development\s+)?skills?\b
    {technology}\s+(?:development\s+|programming\s+)?experience\b
    {technology}\s+(?:is|are)\s+required\b
    \brequired\s+(?:experience|proficiency|expertise|skills?)\s+(?:with|in|using)\s+{technology}
    \bmust\s+have\s+(?:experience|proficiency|expertise|skills?)\s+(?:with|in|using)\s+{technology}
    \b{years}(?:['\u2019])?\s+(?:of\s+)?(?:[\w-]+\s+){0,5}{technology}
    {technology}(?:\s+[\w/-]+){0,4}\s*\(?{years}\)?
    {technology}\s+as\s+(?:a|the)\s+primary\s+language\b

# These templates always describe alternatives: one unblocked item keeps the
# vacancy for agent analysis.
[alternative_technology_list_templates]
values =
    \bproficiency\s+in\s+programming\s+languages?\s+such\s+as\s+{technologies}

# These templates describe separate requirements unless the captured list uses
# "or" or "and/or". AND lists reject when any item contains a blocked technology.
[technology_list_templates]
values =
    \bstrong\s+experience\s+(?:with|in|using)\s+{technologies}
    \bstrong\s+proficiency\s+(?:with|in|using)\s+{technologies}
    \bstrong\s+(?:[\w-]+\s+)*engineering\s+experience\s+(?:with|in|using)\s+{technologies}
    \bsignificant\s+experience\s+(?:with|in|using)\s+{technologies}
    \b{years}\s+(?:досвіду\s+)?(?:[\w-]+\s+){0,4}(?:з\s+)?використанням\s+{technologies}
    \bstrong\s+(?=[^,.;:\r\n]{1,40},){technologies}

[optional_signals]
values =
    \b(?:0|1|zero|one)(?:\s*\+|\s*(?:-|\u2013|\u2014|to)\s*(?:\d+|two|three|four|five|six|seven|eight|nine|ten))?\s+(?:years?|рік|роки|років)\b
    \bnice\s+to\s+have\b
    \boptional\b
    \bis\s+a\s+(?:big\s+)?plus\b
    \bwould\s+be\s+a\s+(?:big\s+)?plus\b
    \bnot\s+required\b
    \b(?:is|are)\s+not\s+(?:strictly\s+)?required\b
    \b(?:isn|aren)(?:'|\u2019)t\s+(?:strictly\s+)?required\b
    \bpreferred\b
