# Conservative rules applied to each non-empty line of readable vacancy text.
# Technologies and requirement signals are independent lists. The filter
# rejects only when both occur in the same line without optional/OR wording.

[filters]
enabled = on

[pass_words]
values = Java

[blocked_technologies]
values = Camunda, C

[hard_requirement_signals]
values =
    \badvanced\b
    \bdeep\s+expertise\b
    \bstrong\s+proficiency\b
    \bextensive\s+experience\b
    \bmust\s+have\b
    \brequired\b
    \b\d+\+?\s+years?\b

[optional_signals]
values =
    \bnice\s+to\s+have\b
    \boptional\b
    \bis\s+a\s+plus\b
    \bwould\s+be\s+a\s+plus\b

[alternative_signals]
values =
    \band/or\b
    \bone\s+of\b
    \bany\s+of\b
