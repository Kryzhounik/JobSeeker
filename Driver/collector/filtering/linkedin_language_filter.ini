# Conservative extraction of explicit human-language requirements.
# Requirement templates must contain both {language} and {level}.
# The template list intentionally starts empty; add only reviewed patterns.

[filters]
enabled = on

[languages]
values =
    English
    Polish
    German
    French
    Ukrainian
    Russian
    Belarusian

[cefr_levels]
values =
    A1
    A2
    B1
    B2
    C1
    C2

[requirement_templates]
values =

[optional_signals]
values =
    \bnice\s+to\s+have\b
    \boptional\b
    \bwould\s+be\s+a\s+(?:big\s+)?plus\b
    \bnot\s+required\b
    \bpreferred\b
