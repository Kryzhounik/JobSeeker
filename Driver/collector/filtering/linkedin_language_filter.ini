# Adjustable interpretation of wording recognized by language_rules.py.
# Regexes, language names, and localized grammar belong in code, not here.

[implied_levels]
communication_skills = B1
communicative = B1
good = B2
strong = B2
proficient = B2
professional = B2
advanced = C1
# Deliberate project policy: fluent remains C1 even though market usage often
# means B2/B2+. See analyzer/job_facts/language_levels_research.txt.
fluent = C1
excellent = C1
native = C2
bilingual = C2
required = C2

# Common textual names for CEFR levels. The canonical A1-C2 names are built in.
[level_aliases]
