# Conservative extraction of human-language requirements.
# Explicit templates capture both {language} and {level} from vacancy text.
# Implied templates capture {language}; their config key supplies the level.
# Add only reviewed patterns; an empty level remains inactive.

[filters]
enabled = on

# Recognition vocabulary compiled into one named regex group. The extractor
# does not run templates separately for each language.
[languages]
values =
    English
    Polish
    German
    French
    Ukrainian
    Russian
    Belarusian

[cefr_levels]
values =
    A1
    A2
    B1
    B2
    C1
    C2

[requirement_templates]
values =
    {language}\s*[:\-–—]\s*{level}
    {language}\s+{level}
    {level}\s+level\s+(?:in|of)\s+{language}
    {language}\s*\(\s*{level}\s+level\s*\)
    {language}\s+(?:language\s+)?(?:at\s+)?{level}\s+level

[implied_level_templates]
A1 =
A2 =
B1 =
B2 =
C1 =
    \badvanced\s+proficiency\s+in\s+{language}
    \bfluency\s+in\s+{language}
    \bfluent\s+in\s+{language}
    \bfluent\s+{language}\s+skills?\b
C2 =

[optional_signals]
values =
    \bnice\s+to\s+have\b
    \boptional\b
    \bwould\s+be\s+a\s+(?:big\s+)?plus\b
    \bnot\s+required\b
    \bpreferred\b
