# LinkedIn collector settings. The guest script ignores browser-only UI filters.
# Location format: Name or Name:geoId.
keywords=Java
locations=Moldova:106178099,Ukraine:102264497,Georgia:106315325,Belarus:101705918,Kazakhstan:106049128,Poland:105072130

# Browser-only UI filters.
experience=entry_level,senior
workplace=remote,hybrid,office
jobTypes=full_time,part_time,contract
datePosted=week
sort=semantic

# Global run limit across all locations, not per location.
limit=100
delaySeconds=15
