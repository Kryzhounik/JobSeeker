# LinkedIn collector settings. The guest script ignores browser-only filters.
# Location format: Name or Name:geoId.
collectorMode=playwright
keywords=Java
# AccountRemote is browser-only; anchor it to the first country in remote mode.
locations=AccountRemote,Moldova:106178099,Ukraine:102264497,Georgia:106315325,Belarus:101705918,Kazakhstan:106049128,Poland:105072130

# Browser URL filters. Country passes keep all configured workplace modes.
experience=associate,mid_senior
remoteBroadWorkplace=remote
workplace=remote,hybrid,office
jobTypes=full_time,part_time,contract
datePosted=week
sort=newest

# Global run limit across all locations, not per location.
limit=100
delaySeconds=15
