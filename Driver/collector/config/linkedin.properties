# LinkedIn search settings.
# Location format: Name or Name:geoId.
# Use AccountRemote for LinkedIn broad remote search without location/geoId.
# It uses remoteBroadWorkplace, not the country workplace setting below.
# If geoId is empty, LinkedIn still receives location=Name.
keywords=Java
locations=AccountRemote,Ukraine:102264497,Moldova:106178099,Georgia:106315325,Belarus:101705918,Kazakhstan:106049128,Poland:105072130

# The current LinkedIn UI exposes Entry-level and Senior instead of the old
# Associate and Mid-Senior categories.
experience=entry_level,senior
remoteBroadWorkplace=remote
workplace=remote,hybrid,office
jobTypes=full_time,part_time,contract
datePosted=week
# The current LinkedIn search ranks results semantically and has no sort UI.
sort=semantic

# Global run limit across all locations, not per location.
limit=100
delaySeconds=15

# Debug fallback: paste a ready LinkedIn URL here if GUI filters produce
# something we do not map yet.
searchUrl=
