[filters]
# Reject mandatory human-language requirements above your proficiency: on/off.
languages = on
# Reject hard core-programming-language requirements above your level: on/off.
programming_languages = on
# off = ignore, on = any remote, location = configured remote scopes only.
remote = location
# off = ignore, on = any relocation, location = configured destinations only.
relocation = location
# any = remote OR relocation can pass; all = both must pass.
remote_relocation_mode = any
