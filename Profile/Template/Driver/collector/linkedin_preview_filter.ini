[filters]
# Enable the preview filter: on or off.
enabled = on

[title]
# Blocked-title list path, relative to this file (or an absolute path).
blocked_terms_file = linkedin_preview_blocked_titles.txt

[decision]
# Keep uncertain titles for further inspection.
when_unsure = open

[age]
# Maximum vacancy age in days, including explicitly opened vacancy URLs.
max_days = 14
