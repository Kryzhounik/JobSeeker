# Search keywords entered in LinkedIn.
keywords=Java
# Ordered search locations: Name or Name:geoId, comma-separated.
# Optional AccountRemote uses the first country in this list as its seed.
locations=Example Country
# Seniority filters: entry_level, manager, senior; comma-separated.
# Empty means no seniority filter.
experience=senior
# Workplace modes for AccountRemote searches.
remoteBroadWorkplace=remote
# Workplace modes for country searches: remote, hybrid, office.
workplace=remote,hybrid,office
# Employment types, e.g. full_time, part_time, contract.
jobTypes=full_time,contract
# Publication window: day, week, month, or empty for any time.
datePosted=week
# Maximum accepted vacancies across all locations in one run; must be positive.
limit=100
