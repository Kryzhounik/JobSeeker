# Search keywords entered in LinkedIn.
keywords=Java
# Ordered search locations, comma-separated. Add each country as Name:geoId.
# Get geoId by selecting the location manually on LinkedIn and copying the
# geoId query parameter from the resulting search URL. Name-only locations are
# unverified and may not filter results. AccountRemote is the intentional
# locationless entry and uses the first country below as its seed.
locations=AccountRemote,Moldova:106178099,Ukraine:102264497,Georgia:106315325,Belarus:101705918,Kazakhstan:106049128,Poland:105072130
# Seniority filters: entry_level, manager, senior; comma-separated.
# Empty means no seniority filter.
experience=senior
# Workplace modes for AccountRemote searches.
remoteBroadWorkplace=remote
# Workplace modes for country searches: remote, hybrid, office.
workplace=remote,hybrid,office
# Employment types, e.g. full_time, part_time, contract.
jobTypes=full_time,contract
# Publication window: day, week, month, or empty for any time.
datePosted=week
# Maximum accepted vacancies across all locations in one run; must be positive.
limit=100
