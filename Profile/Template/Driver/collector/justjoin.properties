# Technology category in the JustJoin search URL.
mainTech=java
# Location slug; all-locations searches everywhere.
location=all-locations
# Vacancy languages as comma-separated ISO codes; empty applies no filter.
languages=en
# Comma-separated seniority levels; empty applies no filter.
experienceLevels=mid,senior
# Maximum publication age in days.
publishedDays=14
# Result ordering direction.
orderBy=DESC
# Result sorting field.
sortBy=published
# Maximum collected offers; 0 means all reported offers.
limit=0
