[pass_words]
# Whole-word title matches bypass title and technology blocks, not language,
# company or duplicate checks. Comma-separated or indented multiline values.
values = Java

[blocked_technologies]
# Starter list for the contextual technology filter, not a list of preferences.
# It rejects confidently recognized hard requirements, e.g. strong proficiency
# or mandatory multiple years of experience, not a technology's mere mention.
# Optional mentions alone do not cause rejection.
# Remove technologies for which your actual experience can meet such hard
# requirements, including their aliases below. Willingness to learn is not
# equivalent to having the required experience. Review before using this list;
# pruning it is easier than building all exclusions from scratch.
