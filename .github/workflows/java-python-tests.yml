name: Tests

on:
  schedule:
    - cron: '17 */4 * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  changes:
    name: Check for new commits
    runs-on: ubuntu-24.04
    outputs:
      run: ${{ steps.check.outputs.run }}
    steps:
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [[ "$GITHUB_EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! previous=$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/java-python-tests.yml/runs?branch=master&status=completed&per_page=10" \
            --jq '[.workflow_runs[] | select(.conclusion == "success" or .conclusion == "failure")][0].head_sha // ""'); then
            echo "::warning::Could not read previous runs; running checks anyway."
            previous=""
          fi
          if [[ "$previous" != "$GITHUB_SHA" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

  unit-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/Driver

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Driver/collector/java_linkedin/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r Driver/collector/java_linkedin/requirements.txt

      - name: Configure CPython and JPy
        shell: bash
        run: &configure-python-jpy |
          python - <<'PY'
          import importlib.util
          import os
          from pathlib import Path
          import sys
          import sysconfig

          lib_dir = Path(sysconfig.get_config_var("LIBDIR"))
          lib_python = lib_dir / sysconfig.get_config_var("LDLIBRARY")
          jpy = importlib.util.find_spec("jpy")
          jdl = importlib.util.find_spec("jdl")
          if jpy is None or jdl is None:
              raise RuntimeError("jpy and jdl native modules are required")

          paths = {
              "python.home": Path(sys.prefix),
              "python.executable": Path(sys.executable),
              "python.library": lib_python,
              "jpy.library": Path(jpy.origin),
              "jdl.library": Path(jdl.origin),
          }
          for name, path in paths.items():
              if not path.exists():
                  raise FileNotFoundError(f"{name}: {path}")

          config = Path("Tools/runtime.properties")
          config.write_text(
              "".join(f"{name}={path.resolve().as_posix()}\n"
                      for name, path in paths.items())
              + "database.path=tmp/ci/jobs.sqlite\n",
              encoding="utf-8",
          )
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as env:
              print(f"LD_LIBRARY_PATH={lib_dir}:{os.getenv('LD_LIBRARY_PATH', '')}", file=env)
          PY

      - name: Java tests (without browser)
        shell: bash
        run: |
          mvn -B -ntp -fae -f Driver/pom.xml -Pci-unit \
            "-Dseeker.project.root=$GITHUB_WORKSPACE" \
            -Dtests.python.skip=true \
            test

      - name: Python Driver tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s Driver/test -p 'test_*.py' -v

      - name: Python Applier tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s Applier/tests -p 'test_*.py' -v

      - name: Save JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: '**/target/surefire-reports/unit/*.xml'
          if-no-files-found: ignore

  browser-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: Browser tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Install Playwright Chromium
        run: |
          mvn -B -ntp -f Tools/pom.xml \
            org.codehaus.mojo:exec-maven-plugin:3.6.4:java \
            -Dexec.mainClass=com.microsoft.playwright.CLI \
            -Dexec.args="install --with-deps chromium"

      - name: Run browser tests
        run: mvn -B -ntp -fae -f Driver/pom.xml -Pci-browser test

      - name: Save JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-reports
          path: '**/target/surefire-reports/browser/*.xml'
          if-no-files-found: ignore

  gui-tests:
    needs: changes
    if: needs.changes.outputs.run == 'true'
    name: GUI tests
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/Driver

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: '**/pom.xml'

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: Driver/collector/java_linkedin/requirements.txt

      - name: Install Python dependencies
        run: python -m pip install -r Driver/collector/java_linkedin/requirements.txt

      - name: Configure CPython and JPy
        shell: bash
        run: *configure-python-jpy

      - name: Install JavaFX display dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth libgtk-3-0t64 libgl1 libasound2t64

      - name: Build backend artifacts (without tests)
        run: mvn -B -ntp -f Driver/pom.xml -DskipTests install

      - name: Run GUI unit tests
        run: mvn -B -ntp -f GUI/JavaFX/pom.xml -Pci-unit -Dtests.python.skip=true test

      - name: Run GUI graphics tests
        if: ${{ !cancelled() }}
        run: xvfb-run -a -s '-screen 0 1920x1080x24' mvn -B -ntp -f GUI/JavaFX/pom.xml -Pci-gui test

      - name: Run GUI Python tests
        if: ${{ !cancelled() }}
        run: python -m unittest discover -s GUI -p 'test_*.py' -v

      - name: Save JUnit reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gui-test-reports
          path: 'GUI/JavaFX/target/surefire-reports/**/*.xml'
          if-no-files-found: ignore
