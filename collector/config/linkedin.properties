# LinkedIn search settings.
# Location format: Name or Name:geoId.
# Use AccountRemote for LinkedIn search without location/geoId. LinkedIn mixes
# account/default-geo remote jobs with broad remote jobs there.
# If geoId is empty, LinkedIn still receives location=Name.
keywords=Java
locations=AccountRemote,Ukraine,Moldova,Georgia,Poland:105072130

# Human names are mapped by collector/linkedin_search_urls.py.
experience=associate,mid_senior
workplace=remote,hybrid,office
jobTypes=full_time,part_time,contract
datePosted=month
sort=newest

# Global run limit across all locations, not per location.
limit=100
delaySeconds=15

# Debug fallback: paste a ready LinkedIn URL here if GUI filters produce
# something we do not map yet.
searchUrl=
