# LinkedIn search settings.
# Location format: Name or Name:geoId.
# If geoId is empty, LinkedIn still receives location=Name.
keywords=Java Software Engineer
locations=Poland:105072130,Ukraine,Moldova,Georgia,Serbia

# Human names are mapped by collector/linkedin_search_urls.py.
experience=associate,mid_senior
workplace=remote
jobTypes=full_time,part_time,contract
datePosted=month
sort=newest

limit=1
delaySeconds=30

# Debug fallback: paste a ready LinkedIn URL here if GUI filters produce
# something we do not map yet.
searchUrl=
