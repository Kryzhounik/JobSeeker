# Runtime switches for the fast candidate-fit filter.
# Personal facts belong in resume.ini, not here.

[filters]
title = off
languages = on
# Strict hard-fail for required programming languages above listed/basic rank.
programming_languages = on
# off = ignore, on = any remote, location = only configured remote scopes.
remote = location
# off = ignore, on = any relocation, location = only configured destinations.
relocation = location
# any = remote OR relocation can pass. all = both must pass.
remote_relocation_mode = any

[title]
blocked_terms =
